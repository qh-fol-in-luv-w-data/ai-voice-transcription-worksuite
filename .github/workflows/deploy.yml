name: Deploy Frappe Apps

on:
  push:
    branches:
      - uat
      - master

jobs:
  deploy-uat:
    if: github.ref == 'refs/heads/uat'
    concurrency:
      group: deploy-uat
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to UAT Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.UAT_SERVER_IP }}
          username: root
          key: ${{ secrets.UAT_SERVER_SSH_KEY }}
          script: |
            su - frappe -c '
              export PATH=$PATH:/home/frappe/.local/bin
              source /home/frappe/frappe-env/bin/activate
              if [ ! -d "/home/frappe/frappe-bench/apps/voice_app" ]; then
                  echo "🚀 App voice_app chưa tồn tại. Đang tự động clone và cài đặt vào UAT..."
                  cd /home/frappe/frappe-bench
                  bench get-app --branch uat https://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@github.com/CTGroup-DAIT/2as-worksuite.git --resolve-deps || true
                  cd /home/frappe/frappe-bench/apps/voice_app
                  git remote rename upstream origin || true
                  cd /home/frappe/frappe-bench
                  bench --site uatapp.ctpai.vn install-app voice_app || true
                  bench --site uatapp.ctpai.vn migrate
                  sudo supervisorctl restart all || true
              fi
              cd /home/frappe/frappe-bench/apps/voice_app
              # Self-healing: Tự động sửa remote nếu kẹt từ lần cài đặt cũ
              git remote rename upstream origin || true
              git clean -fd
              git fetch origin uat || true
              git reset --hard origin/uat || true
                            # Self-healing: Sửa lỗi file apps.txt bị dính chữ (vd: jd_generatorai_ats) do thiếu dấu enter
              sed -i "s/\(voice_app\)/\n\1\n/g" /home/frappe/frappe-bench/sites/apps.txt || true
              sed -i '/^$/d' /home/frappe/frappe-bench/sites/apps.txt || true
              if ! grep -q "^voice_app$" /home/frappe/frappe-bench/sites/apps.txt; then echo "voice_app" >> /home/frappe/frappe-bench/sites/apps.txt; fi
              /home/frappe/deploy.sh voice_app uat uatapp.ctpai.vn
              FRONTEND_DIR=/home/frappe/frappe-bench/apps/voice_app/frontend
              if [ -d "$FRONTEND_DIR" ]; then
                  echo "📦 Phát hiện thư mục frontend độc lập, đang build..."
                  cd "$FRONTEND_DIR"
                  npm install
                  npm run build
                  cd /home/frappe/frappe-bench
                  bench build --app voice_app
                  bench clear-cache
              fi
              if [ -d "/home/frappe/frappe-bench/apps/ct_agent_hub" ]; then
                  echo "🚀 Đăng ký App vào CT Agent Hub..."
                  cd /home/frappe/frappe-bench
                  bench --site uatapp.ctpai.vn execute ct_agent_hub.api.admin.auto_register_agent --kwargs "{\"repo_name\": \"2as-worksuite\"}"
              fi
              echo "🔄 Tự động khởi động lại Frappe Worker để nạp module mới..."
              sudo supervisorctl restart all || true

            '

  deploy-prod:
    if: github.ref == 'refs/heads/master'
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to PROD Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: root
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          script: |
            su - frappe -c '
              export PATH=$PATH:/home/frappe/.local/bin
              source /home/frappe/frappe-env/bin/activate
              if [ ! -d "/home/frappe/frappe-bench/apps/voice_app" ]; then
                  echo "🚀 App voice_app chưa tồn tại. Đang tự động clone và cài đặt vào PROD..."
                  cd /home/frappe/frappe-bench
                  bench get-app --branch master https://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@github.com/CTGroup-DAIT/2as-worksuite.git --resolve-deps || true
                  cd /home/frappe/frappe-bench/apps/voice_app
                  git remote rename upstream origin || true
                  cd /home/frappe/frappe-bench
                  bench --site app.ctpai.vn install-app voice_app || true
                  bench --site app.ctpai.vn migrate
                  sudo supervisorctl restart all || true
              fi
              cd /home/frappe/frappe-bench/apps/voice_app
              # Self-healing: Tự động sửa remote nếu kẹt từ lần cài đặt cũ
              git remote rename upstream origin || true
              git clean -fd
              git fetch origin master || true
              git reset --hard origin/master || true
                            # Self-healing: Sửa lỗi file apps.txt bị dính chữ (vd: jd_generatorai_ats) do thiếu dấu enter
              sed -i "s/\(voice_app\)/\n\1\n/g" /home/frappe/frappe-bench/sites/apps.txt || true
              sed -i '/^$/d' /home/frappe/frappe-bench/sites/apps.txt || true
              if ! grep -q "^voice_app$" /home/frappe/frappe-bench/sites/apps.txt; then echo "voice_app" >> /home/frappe/frappe-bench/sites/apps.txt; fi
              /home/frappe/deploy.sh voice_app master app.ctpai.vn
              FRONTEND_DIR=/home/frappe/frappe-bench/apps/voice_app/frontend
              if [ -d "$FRONTEND_DIR" ]; then
                  echo "📦 Phát hiện thư mục frontend độc lập, đang build..."
                  cd "$FRONTEND_DIR"
                  npm install
                  npm run build
                  cd /home/frappe/frappe-bench
                  bench build --app voice_app
                  bench clear-cache
              fi
              if [ -d "/home/frappe/frappe-bench/apps/ct_agent_hub" ]; then
                  echo "🚀 Đăng ký App vào CT Agent Hub..."
                  cd /home/frappe/frappe-bench
                  bench --site app.ctpai.vn execute ct_agent_hub.api.admin.auto_register_agent --kwargs "{\"repo_name\": \"2as-worksuite\"}"
              fi
              echo "🔄 Tự động khởi động lại Frappe Worker để nạp module mới..."
              sudo supervisorctl restart all || true

            '
